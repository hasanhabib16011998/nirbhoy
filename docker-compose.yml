version: '3.8'
services:
  redis:
    image: redis:alpine
    container_name: nirbhoy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: nirbhoy-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  redis_data: